<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" />
    <title>ParaDev</title>
    <script src="/paradev-runtime-config.js"></script>
    <style id="paradev-startup-style">
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #f6f6f5;
        color: #171717;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .paradev-startup {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
      }

      .paradev-startup-loader {
        display: grid;
        gap: 16px;
        width: min(220px, calc(100vw - 72px));
        place-items: center;
      }

      .paradev-startup-dots {
        display: grid;
        grid-template-columns: repeat(3, 6px);
        align-content: center;
        justify-content: center;
        gap: 4px;
        width: 38px;
        height: 18px;
      }

      .paradev-startup-dots span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #2f6f68;
        animation: paradev-startup-pulse 900ms cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }

      .paradev-startup-dots span:nth-child(2) {
        animation-delay: 120ms;
      }

      .paradev-startup-dots span:nth-child(3) {
        animation-delay: 240ms;
      }

      .paradev-startup-track {
        overflow: hidden;
        width: 100%;
        height: 5px;
        border-radius: 999px;
        background: #e9e9e6;
      }

      .paradev-startup-track span {
        display: block;
        width: 32%;
        min-width: 18%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2f6f68, #7f5636);
        animation: paradev-startup-track 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0d1117;
          color: #e6edf3;
        }

        .paradev-startup-dots span {
          background: #58a6ff;
        }

        .paradev-startup-track {
          background: #30363d;
        }

        .paradev-startup-track span {
          background: linear-gradient(90deg, #58a6ff, #d29922);
        }

      }

      @media (prefers-reduced-motion: reduce) {
        .paradev-startup-dots span,
        .paradev-startup-track span {
          animation: none;
        }
      }

      @keyframes paradev-startup-pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: translateY(2px);
        }

        45% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      @keyframes paradev-startup-track {
        0% {
          transform: translateX(-70%);
        }

        100% {
          transform: translateX(310%);
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BVfxpy8M.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/jsx-runtime-n5LQ9ujS.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CraISORc.css">
  </head>
  <body>
    <div id="root">
      <div id="paradev-startup" class="paradev-startup" role="status" aria-label="Starting ParaDev">
        <div class="paradev-startup-loader">
          <div class="paradev-startup-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="paradev-startup-track" aria-hidden="true">
            <span></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
