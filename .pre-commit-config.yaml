repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: ["--line-length=160", "--check", "--diff"]
        files: ^(src|tests|scripts|demos)/

  - repo: https://github.com/pycqa/flake8
    rev: 7.2.0
    hooks:
      - id: flake8
        args: ["--max-line-length=160", "--ignore=F401,F403,F405,F821,E203,E402,E501,W503,E701,E704,E741"]
        files: ^(src|tests|scripts|demos)/

  - repo: local
    hooks:
      - id: sync-generated-files
        name: Sync generated files
        language: system
        entry: bash scripts/sync-env.bash --check --no-heavenbase
        pass_filenames: false
        files: ^(pyproject\.toml|requirements.*\.txt|README\.en\.md)$

      - id: sync-readme
        name: Sync README files
        entry: bash scripts/sync-readme.bash --check
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
